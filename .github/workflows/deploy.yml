name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, closed]
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Secrets are stored in the "prod" GitHub environment, so the job
    # must opt in to that environment to access them.
    environment: prod
    permissions:
      contents: read
      deployments: write
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify Cloudflare credentials
        # Fail fast with a clear message instead of wrangler's cryptic
        # "Authentication error [code: 10000]". Checks the Workers API
        # directly because /user/tokens/verify requires the token to have
        # User Details: Read, which Workers-scoped tokens often lack.
        run: |
          echo "Target account (CLOUDFLARE_ACCOUNT_ID): $CLOUDFLARE_ACCOUNT_ID"
          HTTP_CODE=$(curl -s -o /tmp/cf_check.json -w '%{http_code}' \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/services?per_page=1" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN")
          echo "Workers API status: $HTTP_CODE"
          cat /tmp/cf_check.json
          python3 -c "import json,sys; d=json.load(open('/tmp/cf_check.json')); sys.exit(0 if d.get('success') else 1)" || {
            echo "::error::CLOUDFLARE_API_TOKEN cannot access account $CLOUDFLARE_ACCOUNT_ID (HTTP $HTTP_CODE). Fix the CLOUDFLARE_ACCOUNT_ID / CLOUDFLARE_API_TOKEN secrets in Settings > Secrets and variables."
            exit 1
          }
          echo "Cloudflare credentials OK."

      - name: Deploy to Cloudflare Pages
        # npx --yes so CI never hits the interactive install prompt. Plain run
        # steps instead of wrangler-action (it also prepends `npx wrangler`, a
        # source of confusion). Create the Pages project on the first deploy;
        # `|| true` makes it a no-op on later runs when it already exists.
        run: |
          npx --yes wrangler pages project create truth-lab --production-branch=main 2>/dev/null || true
          npx --yes wrangler pages deploy ./ --project-name=truth-lab --branch=${{ github.head_ref || github.ref_name }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Inspect truthlab.cc bindings (temp probe)
        run: |
          python3 - <<'EOF'
          import json, os, urllib.request, urllib.error
          acc = os.environ["CLOUDFLARE_ACCOUNT_ID"]
          tok = os.environ["CLOUDFLARE_API_TOKEN"]
          def api(url):
              req = urllib.request.Request(url, headers={"Authorization": f"Bearer {tok}"})
              try:
                  with urllib.request.urlopen(req, timeout=30) as r:
                      return json.load(r)
              except urllib.error.HTTPError as e:
                  return {"success": False, "errors": [{"message": f"HTTP {e.code}: {e.read().decode()[:200]}"}]}
          print("== Pages projects ==")
          for p in api(f"https://api.cloudflare.com/client/v4/accounts/{acc}/pages/projects?per_page=50").get("result", []):
              doms = api(f"https://api.cloudflare.com/client/v4/accounts/{acc}/pages/projects/{p['name']}/domains")["result"]
              print(p["name"], "->", [d["name"] for d in doms])
          print("== Zone truthlab.cc ==")
          z = api("https://api.cloudflare.com/client/v4/zones?name=truthlab.cc")
          for zone in z.get("result", []):
              print(zone["id"], zone["name"], zone["status"])
              wdoms = api(f"https://api.cloudflare.com/client/v4/accounts/{acc}/workers/domains")
              for d in wdoms.get("result", []):
                  print("worker domain:", d.get("hostname"), "->", d.get("worker"))
              routes = api(f"https://api.cloudflare.com/client/v4/zones/{zone['id']}/workers/routes")
              for r in routes.get("result", []):
                  print("worker route:", r.get("pattern"), "->", r.get("script"))
          print("== DNS truthlab.cc ==")
          zid = (z.get("result") or [{}])[0].get("id")
          if zid:
              for r in api(f"https://api.cloudflare.com/client/v4/zones/{zid}/dns_records?per_page=50").get("result", []):
                  print(r["type"], r["name"], r.get("content"), "proxied=" + str(r.get("proxied")))
          print("probe done")
          EOF
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

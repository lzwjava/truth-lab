name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, closed]
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Secrets are stored in the "prod" GitHub environment, so the job
    # must opt in to that environment to access them.
    environment: prod
    permissions:
      contents: read
      deployments: write
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify Cloudflare credentials
        # Fail fast with a clear message instead of wrangler's cryptic
        # "Authentication error [code: 10000]". Checks the Workers API
        # directly because /user/tokens/verify requires the token to have
        # User Details: Read, which Workers-scoped tokens often lack.
        run: |
          echo "Target account (CLOUDFLARE_ACCOUNT_ID): $CLOUDFLARE_ACCOUNT_ID"
          HTTP_CODE=$(curl -s -o /tmp/cf_check.json -w '%{http_code}' \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/services?per_page=1" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN")
          echo "Workers API status: $HTTP_CODE"
          cat /tmp/cf_check.json
          python3 -c "import json,sys; d=json.load(open('/tmp/cf_check.json')); sys.exit(0 if d.get('success') else 1)" || {
            echo "::error::CLOUDFLARE_API_TOKEN cannot access account $CLOUDFLARE_ACCOUNT_ID (HTTP $HTTP_CODE). Fix the CLOUDFLARE_ACCOUNT_ID / CLOUDFLARE_API_TOKEN secrets in Settings > Secrets and variables."
            exit 1
          }
          echo "Cloudflare credentials OK."

      - name: Deploy to Cloudflare Workers
        # wrangler.jsonc: name truth-lab, assets ./ (static site at repo root).
        # truthlab.cc is served by this Worker via the existing zone route
        # (*.truthlab.cc/* -> truth-lab), so every push updates truthlab.cc.
        run: npx --yes wrangler deploy

      - name: Cleanup & purge (temp)
        run: |
          python3 - <<'EOF'
          import json, os, urllib.request, urllib.error
          acc = os.environ["CLOUDFLARE_ACCOUNT_ID"]
          tok = os.environ["CLOUDFLARE_API_TOKEN"]
          def req(method, path, body=None):
              r = urllib.request.Request(f"https://api.cloudflare.com/client/v4/{path}", method=method, headers={"Authorization": f"Bearer {tok}", "Content-Type": "application/json"}, data=json.dumps(body).encode() if body else None)
              try:
                  with urllib.request.urlopen(r, timeout=30) as resp:
                      return resp.status, json.load(resp)
              except urllib.error.HTTPError as e:
                  return e.code, json.loads(e.read().decode() or "{}")
          st, p = req("GET", f"accounts/{acc}/pages/projects")
          if p.get("errors"): print("list pages ERR:", p["errors"])
          else: print("pages projects:", [x["name"] for x in p.get("result", [])])
          st, d = req("DELETE", f"accounts/{acc}/pages/projects/truth-lab")
          print("delete pages truth-lab:", st, d.get("errors") or "ok")
          st, z = req("GET", "zones?name=truthlab.cc")
          zid = z["result"][0]["id"] if z.get("result") else None
          if zid:
              st, pc = req("POST", f"zones/{zid}/purge_cache", {"purge_everything": True})
              print("purge cache:", st, pc.get("errors") or "ok")
          print("cleanup done")
          EOF
